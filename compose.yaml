services:
  bot:
    image: ghcr.io/darkpro1337/greenwatch:${GREENWATCH_TAG:-latest}
    container_name: greenwatch
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/greenwatch.db
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
